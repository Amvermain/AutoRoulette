version: '3.8'

services:
  backend:
    build:
      context: ./roulette-backend
      dockerfile: Dockerfile
    container_name: roulette-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NID_AUT=${NID_AUT}
      - NID_SES=${NID_SES}
    volumes:
      - ./data:/app/data
      - roulette-db:/app
    restart: unless-stopped
    networks:
      - roulette-network

  frontend:
    build:
      context: ./roulette
      dockerfile: Dockerfile
    container_name: roulette-frontend
    ports:
      - "1235:1235"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - roulette-network

volumes:
  roulette-db:

networks:
  roulette-network:
    driver: bridge
